[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-debugger"
version = "0.1.0"
description = "Ascend NPU fault triage (`triage_npu_fault`) and 3-primitive precision, state-corruption & memory-stomp localization toolkit (`npu-watch`, `lockstep-diff`, `call-repro`)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mindie-debugger = "mindie_debugger.cli:main"

[tool.setuptools.packages.find]
include = ["mindie_debugger*"]

[tool.pytest.ini_options]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]
